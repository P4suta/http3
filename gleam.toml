"test/http2_frame_test.gleam" = ["assert_ok_pattern"]
"test/http2_flow_control_test.gleam" = ["assert_ok_pattern"]
"test/http2_header_block_test.gleam" = ["assert_ok_pattern"]
"test/http2_control_test.gleam" = ["assert_ok_pattern"]
