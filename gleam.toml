"test/http2_connection_write_test.gleam" = ["assert_ok_pattern"]
"test/http2_data_writer_test.gleam" = ["assert_ok_pattern"]
"test/http2_header_codec_test.gleam" = ["assert_ok_pattern"]
"test/http2_header_semantics_test.gleam" = ["assert_ok_pattern"]
"test/http2_header_writer_test.gleam" = [
