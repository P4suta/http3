name = "http"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.1"
description = "A unified Gleam HTTP client and server for Erlang/OTP"
licences = ["MIT", "Apache-2.0"]
internal_modules = ["http/internal/**"]

[dependencies]
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
http3 = { path = "packages/http3" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glance = ">= 7.0.0 and < 8.0.0"
glinter = ">= 2.19.2 and < 3.0.0"

[documentation]
pages = [
  { title = "Architecture", path = "architecture.html", source = "docs/ARCHITECTURE.md" },
  { title = "Conformance", path = "conformance.html", source = "docs/CONFORMANCE.md" },
  { title = "Pre-publication security review", path = "security-review.html", source = "docs/SECURITY_REVIEW.md" },
  { title = "Test-driven development", path = "testing.html", source = "docs/TESTING.md" },
  { title = "Protocol-neutral server", path = "server.html", source = "docs/SERVER.md" },
  { title = "First-publication gate", path = "v1.html", source = "docs/V1.md" },
  { title = "Roadmap", path = "roadmap.html", source = "docs/ROADMAP.md" },
]

[tools.glinter]
include = ["src/", "test/"]
warnings_as_errors = true

[tools.glinter.rules]
avoid_panic = "error"
avoid_todo = "error"
unused_exports = "error"

[tools.glinter.ignore]
"test/**/*.gleam" = ["unused_exports"]
# Body cursors and wire-size helpers intentionally keep the conventional
# `body, limit` positional shape. Explicit finite True/False branches name
# error outcomes more clearly than guard continuations in this state machine.
"src/http/body.gleam" = ["label_possible", "prefer_guard_clause"]
"src/http/context.gleam" = ["label_possible", "prefer_guard_clause"]
"src/http/diagnostics.gleam" = ["label_possible", "prefer_guard_clause"]
"src/http/middleware.gleam" = ["label_possible"]
"src/http/resource.gleam" = [
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"src/http/server.gleam" = [
  "deep_nesting",
  "label_possible",
  "prefer_guard_clause",
  "thrown_away_error",
  "unused_exports",
]
# The reusable client is an orchestration boundary: public pipeline setters use
# conventional positional `config, policy` arguments, while recursive retry,
# discovery, and two-route race state stays in one typed coordinator. Backend
# and optional resolver failures are intentionally collapsed or ignored at the
# documented fail-closed policy edge. Adapter runtime errors are likewise
# collapsed into the non-secret SecurityPolicy classification.
"src/http/client.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
  "thrown_away_error",
  "unused_exports",
]
# RFC 9651 parsing keeps a byte cursor, finite counters, and ordered output in
# positional recursive passes that mirror the grammar. Conversion failures are
# intentionally collapsed to the module's strict public Invalid result; the
# public constructors and codecs are stable surface consumed by downstream
# packages rather than by this package itself.
"src/http/structured_fields.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"test/structured_fields_test.gleam" = ["assert_ok_pattern"]
# RFC 9211/9209 serializers use small positional accumulator helpers so they
# compose as pipelines in registered-parameter order. The explicit Boolean
# branch is the single semantic validation boundary for public constructors.
"src/http/status.gleam" = [
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"test/status_test.gleam" = ["assert_ok_pattern"]
# Digest vectors intentionally destructure Result values to show exact RFC
# field output. Public codec exports are also consumed by downstream packages.
"src/http/digest.gleam" = ["unused_exports"]
"test/digest_test.gleam" = ["assert_ok_pattern"]
# RFC 9421 base construction preserves ordered component and metadata state in
# positional helpers. The nested message/role match is the explicit matrix of
# valid derived components; public wire helpers are downstream stable surface.
"src/http/signature.gleam" = [
  "deep_nesting",
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"test/signature_test.gleam" = ["assert_ok_pattern"]
# RFC 9292's four framing variants share positional bounded parsing helpers;
# the public codec surface is intentionally consumed by downstream packages.
"src/http/bhttp.gleam" = [
  "deep_nesting",
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"test/bhttp_test.gleam" = ["assert_ok_pattern"]
# OHTTP keeps RFC 9180 labeled HKDF state and role-specific contexts in
# positional helpers. Cryptographic errors are deliberately collapsed at the
# non-secret public boundary, and deterministic entry points exist for vectors.
"src/http/ohttp.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"test/ohttp_test.gleam" = ["assert_ok_pattern"]
# Compression combines bounded recursive stored-block and dictionary matching
# state with strict Structured Fields. FFI errors are collapsed at the public
# non-secret codec boundary; public APIs are consumed by downstream packages.
"src/http/compression.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"test/compression_test.gleam" = ["assert_ok_pattern"]
# The protocol-neutral WebSocket session mirrors the RFC 6455 frame grammar
# with bounded recursive fragmentation. Public handshake and framing exports
# are stable adapters for all three HTTP protocol implementations.
"src/http/websocket.gleam" = [
  "deep_nesting",
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"test/websocket_test.gleam" = ["assert_ok_pattern"]
# MASQUE keeps wire-order recursive codecs and explicit bounded policy/state
# transitions in one stable protocol module. Assertions occur only after public
# address validation has established the internal route invariants.
"src/http/masque.gleam" = [
  "deep_nesting",
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
# MASQUE setup tests deliberately inject one resolver panic to verify that the
# bounded adapter supervisor redacts and contains application callback faults.
"test/masque_test.gleam" = ["assert_ok_pattern", "avoid_panic"]
# Deterministic qualification corpora intentionally stop at the first violated
# invariant and mirror seed/state order in short recursive generators. Their
# exported entry points are invoked directly from scripts/campaign.escript.
"test/masque_property_corpus.gleam" = [
  "assert_ok_pattern",
  "label_possible",
  "prefer_guard_clause",
]
"test/masque_fuzz_corpus.gleam" = [
  "assert_ok_pattern",
  "label_possible",
  "prefer_guard_clause",
]
# These private policy parsers use short positional recursive passes. Invalid
# optional fields are deliberately ignored so malformed peer metadata cannot
# become a request failure or escape the redacted public error surface.
"src/http/internal/alt_svc.gleam" = [
  "label_possible",
  "thrown_away_error",
]
"src/http/internal/cache.gleam" = [
  "label_possible",
  "thrown_away_error",
]
"src/http/internal/cookie.gleam" = [
  "deep_nesting",
  "label_possible",
  "prefer_guard_clause",
  "thrown_away_error",
]
"src/http/internal/hsts.gleam" = [
  "label_possible",
  "thrown_away_error",
]
# Wire parsers use short positional recursive helpers whose argument order is
# stable within one module. Explicit Boolean branches keep syntax failures
# adjacent to the relevant RFC predicate.
"src/http/internal/http1.gleam" = ["label_possible", "prefer_guard_clause"]
"src/http/internal/http1/body.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http1/encode.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/frame.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/body_length.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/flow_control.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/header_block.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/control.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/connection.gleam" = ["label_possible"]
"src/http/internal/http2/data.gleam" = ["deep_nesting", "label_possible"]
# DATA framing is a private positional wire-slicing state machine. Its short
# recursive helpers mirror the byte cursor and dual-credit order directly.
"src/http/internal/http2/data_writer.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/header_semantics.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/header_codec.gleam" = [
  "label_possible",
  "unused_exports",
]
"src/http/internal/http2/header_writer.gleam" = [
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"src/http/internal/http2/hpack/decoder.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/hpack/dynamic_table.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/hpack/encoder.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/hpack/integer.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/hpack/huffman.gleam" = ["label_possible"]
"src/http/internal/http2/hpack/string_literal.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/hpack/static_table.gleam" = ["label_possible"]
"src/http/internal/http2/settings.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http2/peer_settings.gleam" = ["label_possible"]
"src/http/internal/http2/preface.gleam" = ["label_possible"]
"src/http/internal/http2/message.gleam" = ["label_possible"]
"src/http/internal/http2/stream_registry.gleam" = [
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"src/http/internal/http2/stream_state.gleam" = [
  "label_possible",
  "prefer_guard_clause",
  "unused_exports",
]
"src/http/internal/http2/wire.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
# This one-shot driver keeps socket/wire/response/deadline order positional at
# every recursive call. Backend failures are deliberately collapsed into the
# stable redacted ErrorKind, and explicit branches keep cleanup adjacent to the
# relevant transport outcome.
"src/http/internal/http2/exchange.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
]
# The connection actor keeps socket, wire, stream, and worker ownership in one
# visible transition order. Protocol/backend failures are intentionally
# collapsed into the stable redacted ErrorKind at this private adapter edge.
"src/http/internal/http2/server.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
  "thrown_away_error",
]
# The pure accumulator mirrors ordered connection actions. Positional state
# threading and explicit Boolean resource checks make the protocol sequence
# visible without runtime terms or side effects.
"src/http/internal/http2/exchange_state.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
# This adapter is the intentional redaction boundary between public HTTP/3
# failures and the common Error type. Its accept/stream loops keep transport
# state positional, and listener shutdown plus best-effort 500 fallback are
# terminal ownership edges where the original error cannot be propagated.
"src/http/internal/http3/server.gleam" = [
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
  "thrown_away_error",
]
# The streaming reader mirrors one ordered action batch and emits DATA instead
# of retaining it. Positional state threading and explicit Boolean limit
# branches keep credit ownership and terminal transitions adjacent.
"src/http/internal/http2/response_reader.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/transport.gleam" = [
  "label_possible",
  "prefer_guard_clause",
]
# The exchange is an explicitly redacting state machine: parser, encoder, and
# backend errors are deliberately collapsed into the stable public ErrorKind.
# Short positional recursive helpers keep socket/decoder/deadline transitions
# visible at each call site.
"src/http/internal/http1/exchange.gleam" = [
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
]
"src/http/internal/http1/server.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "label_possible",
  "prefer_guard_clause",
  "thrown_away_error",
  "unused_exports",
]
# Fixed public contract fixtures deliberately fail at the first unexpected
# Result variant so the reported source line identifies the broken contract.
"test/body_test.gleam" = ["assert_ok_pattern"]
"test/context_test.gleam" = ["assert_ok_pattern"]
"test/diagnostics_test.gleam" = [
  "assert_ok_pattern",
  "avoid_panic",
  "label_possible",
]
"test/middleware_test.gleam" = ["assert_ok_pattern"]
"test/resource_test.gleam" = ["assert_ok_pattern"]
"test/server_contract_test.gleam" = ["assert_ok_pattern", "avoid_panic"]
"test/http1_request_head_test.gleam" = ["assert_ok_pattern"]
"test/http1_response_head_test.gleam" = ["assert_ok_pattern"]
"test/http1_body_decoder_test.gleam" = ["assert_ok_pattern"]
"test/http1_encode_test.gleam" = ["assert_ok_pattern"]
"test/http1_server_test.gleam" = [
