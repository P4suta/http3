name = "gleam_quic"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.1"
description = "A Gleam-native QUIC transport core for the Erlang target"
licences = ["MIT", "Apache-2.0"]
internal_modules = [
  "gleam_quic/internal/**",
  "gleam_quic/frame",
  "gleam_quic/packet",
  "gleam_quic/packet_number",
  "gleam_quic/stream_id",
  "gleam_quic/transport_parameter",
  "gleam_quic/varint",
  "gleam_quic/version",
]

[documentation]
pages = [
  { title = "API guide", path = "api.html", source = "docs/API.md" },
  { title = "Deployment and key rotation", path = "deployment.html", source = "docs/DEPLOYMENT.md" },
  { title = "Migration", path = "migration.html", source = "docs/MIGRATION.md" },
]

[dependencies]
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.19.2 and < 3.0.0"

[tools.glinter]
include = ["src/", "test/"]
warnings_as_errors = true

[tools.glinter.rules]
avoid_panic = "error"
avoid_todo = "error"
label_possible = "off"
prefer_guard_clause = "off"
unused_exports = "error"

[tools.glinter.ignore]
"test/**/*.gleam" = ["assert_ok_pattern"]
# The path-dependent parent package consumes this capability probe.
"src/gleam_quic.gleam" = ["unused_exports"]
"src/gleam_quic/client.gleam" = ["unused_exports"]
"src/gleam_quic/config.gleam" = ["unused_exports"]
"src/gleam_quic/diagnostics.gleam" = ["unused_exports"]
"src/gleam_quic/failure.gleam" = ["unused_exports"]
"src/gleam_quic/server.gleam" = ["unused_exports"]
# These package-private transport APIs are consumed by the sibling `http3`
# path package. Package-local unused-export analysis cannot see that boundary.
"src/gleam_quic/internal/driver.gleam" = ["unused_exports"]
"src/gleam_quic/internal/qlog.gleam" = ["unused_exports"]
"src/gleam_quic/internal/tls/authentication.gleam" = ["unused_exports"]
"src/gleam_quic/internal/tls/resumption.gleam" = ["unused_exports"]
"src/gleam_quic/internal/tls/session_ticket.gleam" = ["unused_exports"]
"src/gleam_quic/internal/udp.gleam" = ["unused_exports"]
# The public error deliberately normalises private codec/controller errors.
"src/gleam_quic/internal/connection_state.gleam" = [
  "deep_nesting",
  "error_context_lost",
  "unused_exports",
]
# These endpoint actors deliberately terminate, retry, or discard best-effort
# cleanup results at a single owner-monitored process boundary. Glinter cannot
# model that mailbox ownership; the public real-UDP tests exercise it.
"src/gleam_quic/internal/runtime/client_worker.gleam" = [
  "assert_ok_pattern",
  "deep_nesting",
  "discarded_result",
  "thrown_away_error",
  "unused_exports",
]
"src/gleam_quic/internal/runtime/server_worker.gleam" = [
  "assert_ok_pattern",
  "deep_nesting",
  "discarded_result",
  "thrown_away_error",
]
# Socket teardown is best-effort only after protocol close or candidate-race
# cancellation has begun; all normal-path I/O errors remain typed.
"src/gleam_quic/internal/runtime/client_transport.gleam" = [
  "discarded_result",
  "thrown_away_error",
  "unused_exports",
]
"src/gleam_quic/internal/runtime/server_transport.gleam" = ["unused_exports"]
"src/gleam_quic/internal/runtime/connection.gleam" = ["thrown_away_error"]
# Deterministic clock entry points exist solely for direct persistence tests.
"src/gleam_quic/internal/runtime/ticket_store.gleam" = ["unused_exports"]
