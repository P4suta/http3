name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Change verification
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6

      - name: Install exact MixGleam archive
        run: |
          mix local.hex 2.5.1 --force
          mix archive.install hex mix_gleam 0.6.2 --force

      - name: Run all checks
        run: mise run check

  interop:
    name: Independent HTTP/3 interoperability
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6

      - name: Install hash-locked aioquic peer
        run: mise run interop-setup

      - name: Run bidirectional peer gates
        run: mise run interop

  otp:
    name: Erlang/OTP ${{ matrix.otp }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        otp:
          - "28"
          - "29"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: python

      - name: Select pinned supervisor runtime
        shell: bash
        run: |
          supervisor_python="$(python -I -B -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          printf 'HTTP_PROCESS_SUPERVISOR_PYTHON=%s\n' "${supervisor_python}" >> "${GITHUB_ENV}"

      - name: Install BEAM tools
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: 1.18.1
          rebar3-version: 3.28.0

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      - name: Build native QUIC core with warnings as errors
        working-directory: packages/quic_core
        run: gleam build --warnings-as-errors

      - name: Build HTTP/3 with warnings as errors
        working-directory: packages/http3
        run: gleam build --warnings-as-errors

      - name: Run tests
        run: gleam test

      - name: Test HTTP/3
        working-directory: packages/http3
        run: gleam test

      - name: Test native QUIC core
        working-directory: packages/quic_core
        run: gleam test

  smoke:
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: python

      - name: Select pinned supervisor runtime
        shell: bash
        run: |
          supervisor_python="$(python -I -B -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          printf 'HTTP_PROCESS_SUPERVISOR_PYTHON=%s\n' "${supervisor_python}" >> "${GITHUB_ENV}"

      - name: Separate Windows Python aliases
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [string] $runtimePath = [System.IO.Path]::GetFullPath($env:HTTP_PROCESS_SUPERVISOR_PYTHON)
          [string] $pythonAlias = [System.IO.Path]::Combine([System.IO.Path]::GetDirectoryName($runtimePath), "python3.exe")
          if ($pythonAlias -eq $runtimePath) { throw "Python runtime aliases are ambiguous." }
          [string] $expectedHash = (Get-FileHash -LiteralPath $runtimePath -Algorithm SHA256).Hash
          # The supervisor rejects interpreters with multiple hard links.
          if (Test-Path -LiteralPath $pythonAlias) { Remove-Item -LiteralPath $pythonAlias }
          Copy-Item -LiteralPath $runtimePath -Destination $pythonAlias
          if ((Get-FileHash -LiteralPath $pythonAlias -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "Python runtime bytes changed."
          }

      - name: Install BEAM tools
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: 29.1.2
          gleam-version: 1.18.1
          rebar3-version: 3.28.0
          version-type: strict

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      - name: Build native QUIC core with warnings as errors
        working-directory: packages/quic_core
        run: gleam build --warnings-as-errors

      - name: Build HTTP/3 with warnings as errors
        working-directory: packages/http3
        run: gleam build --warnings-as-errors

      - name: Run tests
        run: gleam test

      - name: Test HTTP/3
        working-directory: packages/http3
        run: gleam test

      - name: Test native QUIC core
        working-directory: packages/quic_core
        run: gleam test

  required:
    name: required
    if: always()
    needs: [quality, interop, otp, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'length == 4 and all(.[]; . == "success")' <<< "${RESULTS}"
