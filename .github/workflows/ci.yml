name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security, FFI, and SBOM gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10

      - name: Run security gates
        run: mise run security

      - name: Upload CycloneDX evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: http3-cyclonedx-sbom
          path: build/security/http3.cdx.json
          if-no-files-found: error

  quality:
    name: Full quality check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10

      - name: Run all checks
        run: mise run check

  interop:
    name: Independent HTTP/3 interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.10

      - name: Install hash-locked aioquic peer
        run: mise run interop-setup

      - name: Run bidirectional peer gates
        run: mise run interop

  otp:
    name: Erlang/OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        otp:
          - "28"
          - "29"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install BEAM tools
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: 1.18.1
          rebar3-version: 3.27.0

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      - name: Build native QUIC core with warnings as errors
        working-directory: packages/gleam_quic
        run: gleam build --warnings-as-errors

      - name: Run tests
        run: gleam test

      - name: Test native QUIC core
        working-directory: packages/gleam_quic
        run: gleam test

  smoke:
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install BEAM tools
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: 29.0.5
          gleam-version: 1.18.1
          rebar3-version: 3.27.0
          version-type: strict

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      - name: Build native QUIC core with warnings as errors
        working-directory: packages/gleam_quic
        run: gleam build --warnings-as-errors

      - name: Run tests
        run: gleam test

      - name: Test native QUIC core
        working-directory: packages/gleam_quic
        run: gleam test
