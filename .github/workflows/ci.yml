name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Change verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Install exact MixGleam archive
        run: |
          mix local.hex 2.5.1 --force
          mix archive.install hex mix_gleam 0.6.2 --force

      - name: Run all checks
        run: mise run check

  interop:
    name: Independent HTTP/3 interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17

      - name: Install hash-locked aioquic peer
        run: mise run interop-setup

      - name: Run bidirectional peer gates
        run: mise run interop

  otp:
    name: Erlang/OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        otp:
          - "28"
          - "29"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install BEAM tools
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: 1.18.1
          rebar3-version: 3.28.0

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      - name: Build native QUIC core with warnings as errors
        working-directory: packages/quic_core
        run: gleam build --warnings-as-errors

      - name: Build HTTP/3 with warnings as errors
        working-directory: packages/http3
        run: gleam build --warnings-as-errors

      - name: Run tests
        run: gleam test

      - name: Test HTTP/3
        working-directory: packages/http3
        run: gleam test

      - name: Test native QUIC core
        working-directory: packages/quic_core
        run: gleam test

  smoke:
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install BEAM tools
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: 29.1.2
          gleam-version: 1.18.1
          rebar3-version: 3.28.0
          version-type: strict

      - name: Build with warnings as errors
        run: gleam build --warnings-as-errors

      - name: Build native QUIC core with warnings as errors
        working-directory: packages/quic_core
        run: gleam build --warnings-as-errors

      - name: Build HTTP/3 with warnings as errors
        working-directory: packages/http3
        run: gleam build --warnings-as-errors

      - name: Run tests
        run: gleam test

      - name: Test HTTP/3
        working-directory: packages/http3
        run: gleam test

      - name: Test native QUIC core
        working-directory: packages/quic_core
        run: gleam test

  required:
    name: required
    if: always()
    needs: [quality, interop, otp, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          jq -e 'length == 4 and all(.[]; . == "success")' <<< "${RESULTS}"
