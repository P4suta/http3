[tools]
gleam = "1.18.1"
erlang = "29.0.5"
rebar = "3.27.0"
actionlint = "1.7.12"
go = "1.27.0"
python = "3.12.13"
uv = "0.12.5"
taplo = "0.10.0"
typos = "1.49.0"
markdownlint-cli2 = "0.22.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
"pipx:reuse" = "6.2.0"
gitleaks = "8.30.1"
osv-scanner = "2.5.1"
semgrep = "1.174.0"
syft = "1.51.0"

[tasks.format]
description = "Check Gleam source formatting"
run = [
  "gleam format --check src test",
  "mise run core-format",
]

[tasks.core-format]
description = "Check the native QUIC core source formatting"
dir = "{{ config_root }}/packages/gleam_quic"
run = "gleam format --check src test"

[tasks.core-check]
description = "Run every native QUIC core package check"
dir = "{{ config_root }}/packages/gleam_quic"
run = [
  "gleam format --check src test",
  "gleam build --warnings-as-errors",
  "gleam test",
  "gleam docs build",
  "gleam run -m glinter",
]

[tasks.core-package]
description = "Build, audit, and reproduce the native QUIC Hex archive"
dir = "{{ config_root }}/packages/gleam_quic"
run = [
  "gleam export hex-tarball",
  "escript ../../test/gleam_quic_hex_package.escript normalize-export . build/gleam_quic-repro-reference.tar",
  "gleam export hex-tarball",
  "escript ../../test/gleam_quic_hex_package.escript normalize-export .",
  "escript ../../test/gleam_quic_hex_package.escript compare-export build/gleam_quic-repro-reference.tar .",
]

[tasks.build]
description = "Build with compiler warnings treated as errors"
run = "gleam build --warnings-as-errors"

[tasks.test]
description = "Run the gleeunit test suite"
run = "gleam test"

[tasks.fault]
description = "Run deterministic real-UDP network fault injection"
run = "gleam run -m http3_fault"

[tasks.fuzz]
description = "Run 10,000 deterministic parser fuzz cases plus retained seeds"
run = [
  "gleam run -m native/gleam_quic_fuzz",
  "cd packages/gleam_quic && gleam run -m gleam_quic_fuzz",
]

[tasks.property]
description = "Run 10,000 reproducible generated wire-codec properties"
run = [
  "gleam run -m native/gleam_quic_property",
  "cd packages/gleam_quic && gleam run -m gleam_quic_property",
]

[tasks.benchmark]
description = "Run one warm-up and five repeatable local benchmark trials"
run = "gleam run -m http3_benchmark -- benchmark"

[tasks.load]
description = "Run the controlled high-concurrency HTTP/3 load workload"
run = "gleam run -m http3_benchmark -- load"

[tasks.soak]
description = "Run a sustained 160,000-stream HTTP/3 soak workload"
run = "gleam run -m http3_benchmark -- soak"

[tasks.diagnose]
description = "Record one optional BeamTrace diagnostic scenario"
run = "bash test/diagnostics/run.sh"

[tasks.interop]
description = "Run both independent HTTP/3 peer phase gates"
run = "bash test/interop/run.sh all"

[tasks.interop-setup]
description = "Install the hash-locked aioquic interoperability peer"
run = [
  "uv venv --clear --python 3.12.13 build/interop-venv",
  "uv pip sync --python build/interop-venv/bin/python --require-hashes --strict test/interop/requirements.lock",
]

[tasks.interop-lock]
description = "Regenerate the hash-locked aioquic peer dependency set"
run = "uv pip compile test/interop/requirements.txt --output-file test/interop/requirements.lock --generate-hashes --universal --python-version 3.12 --exclude-newer 2026-08-24 --custom-compile-command 'mise run interop-lock'"

[tasks.interop-aioquic]
description = "Run bidirectional advanced aioquic interoperability"
run = "bash test/interop/run.sh aioquic"

[tasks.interop-quicgo]
description = "Run bidirectional QUIC v1/v2 quic-go interoperability"
run = "bash test/interop/run.sh quicgo"

[tasks.docs]
description = "Build package documentation"
run = "gleam docs build"

[tasks.ffi-audit]
description = "Run Dialyzer and xref over every production Erlang FFI"
run = "bash test/run_ffi_audit.sh"

[tasks.secret-scan]
description = "Reject secrets except the two fingerprinted public test keys"
run = "gitleaks dir . --redact --no-banner"

[tasks.semgrep]
description = "Run repository-owned FFI and public-boundary security rules"
run = [
  "mkdir -p build/semgrep",
  "SEMGREP_SETTINGS_FILE=build/semgrep/settings.yml SEMGREP_LOG_FILE=build/semgrep/semgrep.log semgrep scan --metrics off --disable-version-check --no-git-ignore --error --config .semgrep.yml src packages/gleam_quic/src",
]

[tasks.sbom]
description = "Generate the release-input CycloneDX SBOM"
run = [
  "mkdir -p build/security",
  "syft scan dir:. --exclude './build/**' --exclude './packages/gleam_quic/build/**' --output cyclonedx-json=build/security/http3.cdx.json --quiet",
]

[tasks.dependency-audit]
description = "Scan pinned interop dependency closures with the OSV database"
run = "osv-scanner scan source -r . --config .osv-scanner.toml --no-call-analysis go"

[tasks.security]
description = "Run secret, static, dependency, licence, FFI, and SBOM gates"
run = [
  "mise run secret-scan",
  "mise run semgrep",
  "mise run dependency-audit",
  "reuse lint",
  "mise run ffi-audit",
  "mise run sbom",
]

[tasks.api]
description = "Audit both compiler-exported API boundaries and snapshots"
run = [
  "gleam export package-interface --out build/http3-package-interface.json",
  "cd packages/gleam_quic && gleam export package-interface --out build/gleam-quic-package-interface.json",
  "escript test/http3_public_api_audit.escript build/http3-package-interface.json packages/gleam_quic/build/gleam-quic-package-interface.json api/http3.snapshot api/gleam_quic.snapshot",
  "escript test/http3_public_api_audit.escript boundary src test api/boundary.allow",
]

[tasks.api-update]
description = "Intentionally refresh both audited canonical API snapshots"
run = [
  "gleam export package-interface --out build/http3-package-interface.json",
  "cd packages/gleam_quic && gleam export package-interface --out build/gleam-quic-package-interface.json",
  "escript test/http3_public_api_audit.escript update build/http3-package-interface.json packages/gleam_quic/build/gleam-quic-package-interface.json api/http3.snapshot api/gleam_quic.snapshot",
]

[tasks.lint]
description = "Run source, prose, configuration, workflow, spelling, and licence linters"
run = [
  "gleam run -m glinter",
  "markdownlint-cli2 \"**/*.md\" \"#build/**\" \"#packages/gleam_quic/build/**\"",
  "taplo fmt --check",
  "taplo lint",
  "actionlint",
  "shellcheck test/diagnostics/run.sh test/interop/run.sh test/run_ffi_audit.sh",
  "shfmt -d test/diagnostics/run.sh test/interop/run.sh test/run_ffi_audit.sh",
  "typos",
  "reuse lint",
  "gitleaks dir . --redact --no-banner",
]

